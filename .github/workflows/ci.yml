name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: azad
        uses: BadLiveware/azad@v0.20261103.4
        with:
          goal: //:ci
      - run: test "${{ steps.azad.outputs.holds }}" = true && test "${{ steps.azad.outputs.needed }}" = 2
